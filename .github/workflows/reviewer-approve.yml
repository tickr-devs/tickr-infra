name: reviewer-approve
# Turns the Reviewer's verdict into a real GitHub approval by the tickr-reviewer GitHub App.
# Pull requests here are opened under the owner's account, and GitHub never counts an author's
# own approval, so the approval comes from the App's own identity instead. Each repository has a
# small `approve` workflow that calls this one on a new pull request comment; the logic lives only
# here (one source).
#
# Who can trigger it: only a comment written by the owner's account (immutable user id below,
# checked again by the caller), on an open pull request, with a line exactly
# "/approve <40-hex head sha>". The sha must equal the pull request's head right now, and the
# review is posted on that commit. Pinning alone does not stop a later push from merging on the
# approval: the base branch's ruleset must also have "Dismiss stale pull request approvals when new
# commits are pushed" and "Require approval of the most recent reviewable push", and this job
# refuses to approve when either is off. Nothing from the pull request is checked out or run.
#
# This records the Reviewer's verdict on GitHub; it is not an independent control. Every Claude
# thread writes as the owner's account, so any of them could post the command, and this job knows
# nothing of CI or Fable (the Reviewer checks those before it writes the line).
#
# One-time setup by the owner (README "Reviewer approvals"): the App, its id in the organization
# variable TICKR_REVIEWER_APP_ID and its private key in the organization secret
# TICKR_REVIEWER_KEY. The key is read only by openssl from a mode-600 file and never printed; the
# installation token is revoked when the job ends.
on:
  workflow_call:
    secrets:
      TICKR_REVIEWER_KEY:
        description: "Private key (PEM) of the tickr-reviewer GitHub App; read only to sign its JWT"
        required: true
permissions:
  pull-requests: read
jobs:
  pr-approve-as-app:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The owner's GitHub user id (valentyn-dymaretskyi); a login can be renamed, an id cannot.
    if: >-
      ${{ github.event.issue.pull_request
      && github.event.issue.state == 'open'
      && github.event.comment.user.id == 5245855 }}
    concurrency:
      group: reviewer-approve-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      COMMENT_URL: ${{ github.event.comment.html_url }}
      APP_ID: ${{ vars.TICKR_REVIEWER_APP_ID }}
      APP_KEY: ${{ secrets.TICKR_REVIEWER_KEY }}
    steps:
      - name: Approve the reviewed head as the App
        run: |
          set -euo pipefail
          sha=$(printf '%s\n' "$COMMENT_BODY" | tr -d '\r' \
            | sed -n -E 's#^/approve ([0-9a-f]{40})[[:space:]]*$#\1#p' | head -n 1)
          if [ -z "$sha" ]; then
            echo "No '/approve <head sha>' line in the comment: nothing to do."
            exit 0
          fi
          [ -n "$APP_ID" ] || { echo "refused: organization variable TICKR_REVIEWER_APP_ID is not set" >&2; exit 1; }
          [ -n "$APP_KEY" ] || { echo "refused: organization secret TICKR_REVIEWER_KEY is not set" >&2; exit 1; }

          read -r state head base < <(gh api "repos/$REPO/pulls/$PR" \
            --jq '"\(.state) \(.head.sha) \(.base.ref)"')
          if [ "$state" != "open" ]; then
            echo "refused: pull request #$PR is $state" >&2; exit 1
          fi
          if [ "$head" != "$sha" ]; then
            echo "refused: the verdict names $sha but the head of #$PR is now $head" >&2; exit 1
          fi
          # A later push must drop this approval and need a new one, or it would merge unreviewed.
          guarded=$(gh api "repos/$REPO/rules/branches/$base" --jq '[.[] | select(.type == "pull_request")
            | select(.parameters.dismiss_stale_reviews_on_push and .parameters.require_last_push_approval)]
            | length')
          if [ "$guarded" -eq 0 ]; then
            echo "refused: the $base ruleset needs 'Dismiss stale pull request approvals' and 'Require approval of the most recent reviewable push'" >&2
            exit 1
          fi

          # A ten-minute App JWT (RS256), signed by openssl from a private file.
          key="$RUNNER_TEMP/app-key.pem"
          token=""
          revoke() {
            rm -f "$key"
            if [ -n "$token" ]; then
              curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $token" \
                -H "Accept: application/vnd.github+json" https://api.github.com/installation/token || true
            fi
          }
          trap revoke EXIT
          (umask 077; printf '%s\n' "$APP_KEY" > "$key")
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now=$(date +%s)
          header=$(printf '{"alg":"RS256","typ":"JWT"}' | b64)
          claims=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((now - 60))" "$((now + 540))" "$APP_ID" | b64)
          signature=$(printf '%s.%s' "$header" "$claims" | openssl dgst -sha256 -sign "$key" -binary | b64)
          jwt="$header.$claims.$signature"
          echo "::add-mask::$jwt"
          rm -f "$key"

          api() { curl -sS --fail-with-body -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }
          installation=$(api -H "Authorization: Bearer $jwt" \
            "https://api.github.com/repos/$REPO/installation" | jq -r '.id')
          # The token reaches this repository only. Contents write is what makes GitHub count the
          # App's approval as one from someone with write access; this job never pushes.
          token=$(api -X POST -H "Authorization: Bearer $jwt" \
            "https://api.github.com/app/installations/$installation/access_tokens" \
            -d "$(jq -n --arg repo "${REPO#*/}" \
              '{repositories: [$repo], permissions: {pull_requests: "write", contents: "write"}}')" \
            | jq -r '.token')
          echo "::add-mask::$token"

          api -X POST -H "Authorization: Bearer $token" \
            "https://api.github.com/repos/$REPO/pulls/$PR/reviews" \
            -d "$(jq -n --arg sha "$sha" --arg url "$COMMENT_URL" \
              '{commit_id: $sha, event: "APPROVE",
                body: ("Approved at " + $sha + " on the Reviewer verdict " + $url)}')" \
            | jq -r '"review \(.id) \(.state) at \(.commit_id) by \(.user.login)"'

          # shellcheck disable=SC2016 # $owner, $name and $pr are GraphQL variables.
          decision=$(gh api graphql -F owner="${REPO%/*}" -F name="${REPO#*/}" -F pr="$PR" -f query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) { pullRequest(number: $pr) { reviewDecision } }
            }' --jq '.data.repository.pullRequest.reviewDecision')
          echo "Review decision of #$PR is now: ${decision:-none (no approvals required)}"
